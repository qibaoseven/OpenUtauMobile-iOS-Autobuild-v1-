name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 安装 MAUI 工作负载
        run: |
          dotnet workload install maui
          dotnet workload update

      - name: 切换 Xcode 到 26.5
        run: sudo xcode-select -s "/Applications/Xcode_26.5.app"

      - name: 创建 Entitlements.plist
        run: |
          mkdir -p OpenUtauMobile/Platforms/iOS
          echo '<?xml version="1.0" encoding="UTF-8"?>' > OpenUtauMobile/Platforms/iOS/Entitlements.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> OpenUtauMobile/Platforms/iOS/Entitlements.plist
          echo '<plist version="1.0">' >> OpenUtauMobile/Platforms/iOS/Entitlements.plist
          echo '<dict/>' >> OpenUtauMobile/Platforms/iOS/Entitlements.plist
          echo '</plist>' >> OpenUtauMobile/Platforms/iOS/Entitlements.plist

      - name: 编译未签名的 .app
        run: |
          dotnet build OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false

      - name: 查找并验证 .app
        run: |
          CONFIG="Debug"
          echo "🔍 搜索 .app 文件..."
          APP_PATH=$(find OpenUtauMobile/bin -name "*.app" -type d -print -quit 2>/dev/null || echo "")
          
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "✅ 找到 .app: $APP_PATH"
            echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          else
            echo "❌ 未找到 .app 文件"
            find OpenUtauMobile/bin -type d -maxdepth 3 2>/dev/null || echo "无 bin 目录"
            exit 1
          fi

      - name: 手动打包成 .ipa
        run: |
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find OpenUtauMobile/bin -name "*.app" -type d -print -quit 2>/dev/null || echo "")
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ 未找到 .app 文件"
            exit 1
          fi
          
          echo "📦 打包中: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r OpenUtauMobile.ipa Payload
          echo "✅ IPA 创建成功"
          ls -lh OpenUtauMobile.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iOS
          path: OpenUtauMobile.ipa
          retention-days: 14
