name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 调试 - 确认 Entitlements.plist 是否存在
        run: |
          ls -la OpenUtauMobile/Platforms/iOS/

      - name: 设置 Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
        
      - name: 安装 .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - name: 安装所有 MAUI 工作负载（安卓+iOS 一起装）
        run: |
          dotnet workload install maui
          
      - name: 还原依赖
        run: |
          dotnet restore OpenUtauMobile/OpenUtauMobile.csproj

      - name: 创建空的 Entitlements.plist 文件
        run: |
          mkdir -p OpenUtauMobile/Platforms/iOS
          echo '<?xml version="1.0" encoding="UTF-8"?>' > OpenUtauMobile/Platforms/iOS/Entitlements.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> OpenUtauMobile/Platforms/iOS/Entitlements.plist
          echo '<plist version="1.0">' >> OpenUtauMobile/Platforms/iOS/Entitlements.plist
          echo '<dict/>' >> OpenUtauMobile/Platforms/iOS/Entitlements.plist
          echo '</plist>' >> OpenUtauMobile/Platforms/iOS/Entitlements.plist
          
      - name: 编译未签名的 IPA
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:EnableCodeSigning=false \
            -p:CodeSignEntitlements=none
          
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iOS
          path: OpenUtauMobile/bin/Debug/net9.0-ios/ios-arm64/publish/*.ipa
